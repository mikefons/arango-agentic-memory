[project]
name = "arango-memory"
version = "0.1.0"
description = "Agentic memory core for ArangoDB — ingestion, retrieval, consolidation, decay"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Michael Fonseca" }]
keywords = ["arangodb", "agentic-memory", "llm", "rag", "retrieval", "knowledge-graph"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database",
    "Typing :: Typed",
]
dependencies = [
    "python-arango>=8.1.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "openai>=1.54.0",
    "anthropic>=0.39.0",
    "tiktoken>=0.8.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "pyjwt[crypto]>=2.9.0",
]

[project.urls]
Homepage = "https://github.com/mikefons/arango-agentic-memory"
Repository = "https://github.com/mikefons/arango-agentic-memory"
Changelog = "https://github.com/mikefons/arango-agentic-memory/blob/main/CHANGELOG.md"
Issues = "https://github.com/mikefons/arango-agentic-memory/issues"

[project.scripts]
arango-memory-ops = "arango_memory.ops:main"

[project.optional-dependencies]
extraction = [
    "spacy>=3.8.0",
    "gliner>=0.2.0",
    "glirel>=1.0.0",
]
# Lightweight spacy-only extractor (EXTRACTION_PROVIDER=spacy) — real typed NER without the
# torch-heavy gliner/glirel tiers. The cheap first rung for the HX-1b graph-on benchmark.
# After installing, fetch the model: `make spacy-model` (python -m spacy download en_core_web_sm).
extraction-spacy = [
    "spacy>=3.8.0",
]
mcp = [
    "mcp>=1.2.0",
]
langchain = [
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
]
crewai = [
    "crewai>=0.80.0",
]
# Optional cross-encoder reranker (RQ-2b, DESIGN.md §9). Install to enable
# `reranker_provider="local"`; the core reranks with the keyless FakeReranker without it.
rerank = [
    "sentence-transformers>=3.0.0",
]
# Optional shared (cross-instance) layer for the rate limiter + embedding cache
# (DESIGN.md §17/§16). Install to enable; the core stays per-instance without it.
redis = [
    "redis>=5.0.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "testcontainers>=4.8.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "mcp>=1.2.0",
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
    "redis>=5.0.0",
    "fakeredis>=2.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arango_memory"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends() is designed to be called in argument defaults.
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Import the package from src directly — robust regardless of editable-install
# state (uv's editable .pth for src-layout can be flaky across re-syncs).
pythonpath = ["src"]
