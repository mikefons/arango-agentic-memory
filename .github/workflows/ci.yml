name: ci

# Lint, type-check, and test the Python core. Integration + eval tests spin a
# real ArangoDB Enterprise container via testcontainers (evaluation mode — no
# license needed), so the job relies on Docker being present on the runner.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: Core (lint, type, test) — py${{ matrix.python }}
    runs-on: ubuntu-latest
    # 3.11 is the published wheel's floor (requires-python); 3.14 is the container image's
    # interpreter (IMG-1). Both must pass.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: make sync

      - name: Lint, type-check, test
        run: make ci

      # The MCP server's HTTP mode against the lowest `mcp` release the extra allows — a
      # floor check, so it runs on the floor Python only.
      - name: MCP floor smoke (mcp>=1.17.0)
        if: matrix.python == '3.11'
        run: make mcp-floor

  crewai:
    name: Core — CrewAI adapter vs real crewai
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # The `core` job runs these tests with crewai absent (the unified-backend suite skips);
      # this job installs the real extra so an upstream crewai interface change fails CI
      # instead of slipping past a stub (CW-1).
      - name: Test + type-check against real crewai
        run: make test-crewai

  adapter:
    name: Adapter (typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/vercel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/vercel/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check, build, test
        run: |
          npm run typecheck
          npm run build
          npm test

  dungeon:
    name: Dungeon (typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            packages/vercel/package-lock.json
            examples/dungeon/package-lock.json

      # The dungeon consumes @arango-memory/vercel via a file: dependency, so its
      # dist/ must exist before the Next.js build resolves the import.
      - name: Build the adapter
        working-directory: packages/vercel
        run: |
          npm ci
          npm run build

      - name: Install, build, type-check, test (dungeon)
        working-directory: examples/dungeon
        run: |
          npm ci
          npm run build
          npm run typecheck
          npm test

  diligence:
    name: Diligence (typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: examples/diligence-room/package-lock.json

      # The Due-Diligence Room is a standalone app (no @arango-memory/vercel dependency);
      # it talks to the core over plain HTTP. Kept separate from the dungeon so neither
      # can break the other (docs/DILIGENCE.md — parallel development & isolation).
      - name: Install, build, type-check, test (diligence-room)
        working-directory: examples/diligence-room
        run: |
          npm ci
          npm run build
          npm run typecheck
          npm test

  image:
    name: Core image (build smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build the container on every PR so Dockerfile regressions (base, non-root,
      # healthcheck, deps) surface here, not only on a release tag. No push.
      - name: Build core image
        run: docker build -t arango-memory-core:ci -f core/Dockerfile core

      # The same image's MCP role (MCP-2): boots without a core, answers /health unauthenticated,
      # gates /mcp behind a bearer, and completes an MCP initialize over Streamable HTTP.
      - name: Smoke the MCP HTTP role
        run: |
          docker run -d --name mcp -p 127.0.0.1:8000:8000 \
            -e ARANGO_MEMORY_MCP_HOST=0.0.0.0 \
            -e ARANGO_MEMORY_MCP_ALLOWED_HOSTS='localhost:*,127.0.0.1:*' \
            arango-memory-core:ci python -m arango_memory.mcp --transport http
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf localhost:8000/health | grep -q '"ok"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/mcp -d '{}')" = 401
          curl -sf -X POST localhost:8000/mcp \
            -H 'authorization: Bearer ci' -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | grep -q '"serverInfo"'
          docker rm -f mcp

  docs:
    name: Docs (link check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Offline link check: verifies relative/local markdown links resolve (catches
      # cross-doc rot when files move). External URLs + #anchors are not checked —
      # keeps it fast and deterministic, no network flakiness. Honors .gitignore so
      # vendored node_modules/.venv markdown is skipped.
      - name: Check markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: "--offline --no-progress '**/*.md'"
          fail: true
