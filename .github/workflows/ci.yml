name: ci

# Lint, type-check, and test the Python core. Integration + eval tests spin a
# real ArangoDB Enterprise container via testcontainers (evaluation mode — no
# license needed), so the job relies on Docker being present on the runner.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: Core (lint, type, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: make sync

      - name: Lint, type-check, test
        run: make ci
