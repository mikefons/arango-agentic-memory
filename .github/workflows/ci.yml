name: ci

# Lint, type-check, and test the Python core. Integration + eval tests spin a
# real ArangoDB Enterprise container via testcontainers (evaluation mode — no
# license needed), so the job relies on Docker being present on the runner.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: Core (lint, type, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: make sync

      - name: Lint, type-check, test
        run: make ci

  adapter:
    name: Adapter (typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/vercel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/vercel/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check, build, test
        run: |
          npm run typecheck
          npm run build
          npm test

  dungeon:
    name: Dungeon (typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            packages/vercel/package-lock.json
            examples/dungeon/package-lock.json

      # The dungeon consumes @arango-memory/vercel via a file: dependency, so its
      # dist/ must exist before the Next.js build resolves the import.
      - name: Build the adapter
        working-directory: packages/vercel
        run: |
          npm ci
          npm run build

      - name: Install, build, type-check, test (dungeon)
        working-directory: examples/dungeon
        run: |
          npm ci
          npm run build
          npm run typecheck
          npm test

  diligence:
    name: Diligence (typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: examples/diligence-room/package-lock.json

      # The Due-Diligence Room is a standalone app (no @arango-memory/vercel dependency);
      # it talks to the core over plain HTTP. Kept separate from the dungeon so neither
      # can break the other (docs/DILIGENCE.md — parallel development & isolation).
      - name: Install, build, type-check, test (diligence-room)
        working-directory: examples/diligence-room
        run: |
          npm ci
          npm run build
          npm run typecheck
          npm test

  image:
    name: Core image (build smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build the container on every PR so Dockerfile regressions (base, non-root,
      # healthcheck, deps) surface here, not only on a release tag. No push.
      - name: Build core image
        run: docker build -t arango-memory-core:ci -f core/Dockerfile core

  docs:
    name: Docs (link check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Offline link check: verifies relative/local markdown links resolve (catches
      # cross-doc rot when files move). External URLs + #anchors are not checked —
      # keeps it fast and deterministic, no network flakiness. Honors .gitignore so
      # vendored node_modules/.venv markdown is skipped.
      - name: Check markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: "--offline --no-progress '**/*.md'"
          fail: true
