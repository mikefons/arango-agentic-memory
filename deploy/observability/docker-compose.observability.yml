# Runnable sample observability stack for the arango-memory core (DESIGN.md §18).
#
#   docker compose -f docker-compose.observability.yml up
#
# Then run the core with OTLP export pointed at the collector (see
# otel-collector-config.yaml header), and open Grafana at http://localhost:3000
# (admin/admin) — import grafana-dashboard.json, datasource = the Prometheus below.
#
# This is a standalone demo stack; it does not start the core or ArangoDB.

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC (point the core here)
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus exporter (scraped by Prometheus)

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
